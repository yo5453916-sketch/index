name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/example/webapp
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "WebApp"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.example.webapp'
            compileSdk 34
            defaultConfig {
              applicationId "com.example.webapp"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="IPTV" android:usesCleartextTraffic="true"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden"
                android:hardwareAccelerated="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/webapp/MainActivity.java <<'EOF'
          package com.example.webapp;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          public class MainActivity extends Activity {
            WebView w;
            View customView;
            WebChromeClient.CustomViewCallback customCb;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient() {
                @Override public void onShowCustomView(View v, CustomViewCallback cb) {
                  customView = v; customCb = cb;
                  setContentView(v);
                }
                @Override public void onHideCustomView() {
                  setContentView(w);
                  if (customCb != null) customCb.onCustomViewHidden();
                  customView = null;
                }
              });
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed() {
              if (customView != null) { w.getWebChromeClient().onHideCustomView(); return; }
              w.evaluateJavascript("window.dispatchEvent(new PopStateEvent('popstate'))", null);
            }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
